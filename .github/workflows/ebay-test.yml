name: eBay Scrape Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test scraping ebay.it da runner
        shell: pwsh
        run: |
          $UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"
          try {
            $r = Invoke-WebRequest -Uri "https://www.ebay.it/sch/i.html?_nkw=lego+76294&_sop=10" -Headers @{ "User-Agent" = $UA } -UseBasicParsing -TimeoutSec 60
            Write-Host "HTTP $($r.StatusCode) - lunghezza contenuto: $($r.Content.Length)"
            $ids = [regex]::Matches($r.Content, '/itm/(\d{9,15})')
            Write-Host "item id trovati: $($ids.Count)"
            $uniq = @($ids | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique -First 5)
            Write-Host "esempi id: $($uniq -join ', ')"
            $prices = [regex]::Matches($r.Content, '(\d{1,6}[,.]\d{2})\s*(?:&nbsp;)?\s*EUR|EUR\s*(\d{1,6}[,.]\d{2})')
            Write-Host "prezzi trovati: $($prices.Count)"
            $caps = [regex]::Matches($r.Content, 'class="s-item__title"[\s\S]{0,200}?>([^<]{5,120})<')
            Write-Host "titoli s-item: $($caps.Count)"
            $caps | Select-Object -First 5 | ForEach-Object { Write-Host ("- " + $_.Groups[1].Value) }
          } catch {
            Write-Host "SCRAPING KO: $($_.Exception.Message)"
            if ($_.Exception.Response) { Write-Host "HTTP $([int]$_.Exception.Response.StatusCode)" }
            exit 1
          }
