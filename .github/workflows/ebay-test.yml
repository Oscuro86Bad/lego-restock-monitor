name: eBay Scrape Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test curl_cffi (fingerprint TLS Chrome) su eBay da runner
        run: |
          pip install curl_cffi -q
          python3 - <<'EOF'
          from curl_cffi import requests
          import re

          url = "https://www.ebay.it/sch/i.html?_nkw=lego+76294&_sop=10"
          for target in ["chrome", "chrome131", "safari", "firefox"]:
              try:
                  r = requests.get(url, impersonate=target, timeout=45,
                                   headers={"Accept-Language": "it-IT,it;q=0.9"})
                  ids = re.findall(r"/itm/(\d{9,15})", r.text)
                  uniq = list(dict.fromkeys(ids))[:5]
                  print(f"{target} -> HTTP {r.status_code}, {len(r.text)} byte, item id: {len(ids)}, esempi: {','.join(uniq)}")
              except Exception as e:
                  print(f"{target} -> KO: {e}")
          EOF
