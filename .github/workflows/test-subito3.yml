name: Subito Test 3 (warm-up, temporaneo)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-subito
          restore-keys: |
            playwright-chromium-subito

      - name: Installa Playwright
        run: |
          npm init -y > /dev/null
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1

      - name: Test con warm-up
        run: |
          cat > test3.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-blink-features=AutomationControlled']
            });
            const ctx = await browser.newContext({
              locale: 'it-IT',
              viewport: { width: 1366, height: 850 }
            });
            // NON forzo l'userAgent: lascio quello reale di Chromium
            const page = await ctx.newPage();
            // 1) warm-up homepage
            await page.goto('https://www.subito.it/', { waitUntil: 'load', timeout: 60000 });
            await page.waitForTimeout(6000);
            console.log('Dopo warm-up, URL:', page.url());
            console.log('Dopo warm-up, title:', await page.title());
            // 2) ricerca
            for (const q of ['lego x mansion', '76294']) {
              const url = 'https://www.subito.it/annunci-italia/vendita/?q=' + encodeURIComponent(q);
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto timeout (continuo comunque)'));
                await page.waitForTimeout(5000);
                console.log('--- QUERY:', q, '---');
                console.log('URL finale:', page.url());
                console.log('Title:', await page.title());
                // guarda __NEXT_DATA__ dopo idratazione
                const nd = await page.evaluate(() => {
                  const s = document.querySelector('#__NEXT_DATA__');
                  if (!s) return null;
                  try {
                    const o = JSON.parse(s.textContent);
                    const items = o.props && o.props.pageProps && o.props.pageProps.initialState && o.props.pageProps.initialState.items;
                    const search = o.props && o.props.pageProps && o.props.pageProps.initialState && o.props.pageProps.initialState.search;
                    return { total: items && items.total, nOrig: items && items.originalList && items.originalList.length, query: search && search.query && search.query.text, pageName: o.page };
                  } catch (e) { return { err: String(e) }; }
                });
                console.log('NEXT_DATA:', JSON.stringify(nd));
                const links = await page.$$eval('a[href$=".htm"]', els => els.map(e => e.getAttribute('href')));
                const uniq = [...new Set(links.filter(u => /-[0-9]{8,12}\.htm$/.test(u)))];
                console.log('Annunci unici con id:', uniq.length);
                uniq.slice(0, 6).forEach(u => console.log('  ', u));
                const html = await page.content();
                fs.writeFileSync('render3_' + q.replace(/\W+/g, '_') + '.html', html);
              } catch (e) {
                console.log('ERRORE query ' + q + ': ' + e.message);
              }
            }
            await browser.close();
          })();
          EOF
          node test3.js
