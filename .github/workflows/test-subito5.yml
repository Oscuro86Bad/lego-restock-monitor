name: Subito Test 5 (nuova rotta, temporaneo)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test HTTP puro sulla nuova rotta
        shell: pwsh
        run: |
          $UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"
          foreach ($q in @("lego x mansion", "76294", "76352")) {
            $enc = [uri]::EscapeDataString($q)
            $url = "https://www.subito.it/annunci-italia/vendita/usato/?q=$enc"
            Write-Host "--- QUERY: $q ---"
            try {
              $r = Invoke-WebRequest -Uri $url -Headers @{ "User-Agent" = $UA; "Accept-Language" = "it-IT,it;q=0.9" } -UseBasicParsing -TimeoutSec 60
              $c = $r.Content
              Write-Host "HTTP $($r.StatusCode), $($c.Length) caratteri, URL finale: $($r.BaseResponse.ResponseUri)"
              $j = [regex]::Match($c, '<script id="__NEXT_DATA__" type="application/json">(.*?)</script>').Groups[1].Value
              if ($j) {
                $o = $j | ConvertFrom-Json
                $items = $o.props.pageProps.initialState.items
                Write-Host "total: $($items.total) / originalList: $($items.originalList.Count)"
                foreach ($it in ($items.originalList | Select-Object -First 6)) {
                  Write-Host "  id=$($it.id) | $($it.subject) | $($it.price.value)"
                }
              } else { Write-Host "NEXT_DATA assente" }
            } catch {
              Write-Host "ERRORE: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
