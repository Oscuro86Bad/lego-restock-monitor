name: Subito Test 4 (xvfb headed, temporaneo)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-subito
          restore-keys: |
            playwright-chromium-subito

      - name: Installa Playwright + xvfb
        run: |
          npm init -y > /dev/null
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1
          sudo apt-get update -qq > /dev/null 2>&1
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1
          echo "xvfb installato"

      - name: Test headed su display virtuale
        run: |
          cat > test4.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({
              headless: false,          // MODALITA' HEADED su display virtuale
              args: ['--disable-blink-features=AutomationControlled', '--no-sandbox']
            });
            const ctx = await browser.newContext({ locale: 'it-IT', viewport: { width: 1366, height: 850 } });
            const page = await ctx.newPage();
            await page.goto('https://www.subito.it/', { waitUntil: 'load', timeout: 60000 });
            await page.waitForTimeout(6000);
            console.log('UA reale:', await page.evaluate(() => navigator.userAgent));
            for (const q of ['lego x mansion', '76294']) {
              const url = 'https://www.subito.it/annunci-italia/vendita/?q=' + encodeURIComponent(q);
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
                await page.waitForTimeout(5000);
                console.log('--- QUERY:', q, '---');
                console.log('URL finale:', page.url());
                console.log('Title:', await page.title());
                const nd = await page.evaluate(() => {
                  const s = document.querySelector('#__NEXT_DATA__');
                  if (!s) return null;
                  const o = JSON.parse(s.textContent);
                  const st = o.props.pageProps.initialState;
                  return { total: st.items.total, nOrig: st.items.originalList.length, query: (st.search.query && st.search.query.text) || null };
                });
                console.log('NEXT_DATA:', JSON.stringify(nd));
                const links = await page.$$eval('a[href$=".htm"]', els => els.map(e => e.getAttribute('href')));
                const uniq = [...new Set(links.filter(u => /-[0-9]{8,12}\.htm$/.test(u)))];
                console.log('Annunci unici con id:', uniq.length);
                uniq.slice(0, 8).forEach(u => console.log('  ', u));
                fs.writeFileSync('render4_' + q.replace(/\W+/g, '_') + '.html', await page.content());
              } catch (e) {
                console.log('ERRORE query ' + q + ': ' + e.message);
              }
            }
            await browser.close();
          })();
          EOF
          xvfb-run -a --server-args="-screen 0 1366x850x24" node test4.js
