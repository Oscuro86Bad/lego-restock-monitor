name: Subito Test 2 (playwright, temporaneo)

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa Playwright (chromium)
        run: |
          npm init -y > /dev/null
          npm install playwright@latest --silent
          npx playwright install --with-deps chromium > /dev/null 2>&1

      - name: Ricerca con browser vero
        run: |
          cat > test.js << 'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--disable-blink-features=AutomationControlled']
            });
            const ctx = await browser.newContext({
              locale: 'it-IT',
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36',
              viewport: { width: 1366, height: 850 }
            });
            const page = await ctx.newPage();
            for (const q of ['lego x mansion', '76294']) {
              const url = 'https://www.subito.it/annunci-italia/vendita/?q=' + encodeURIComponent(q);
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                // attende la lista annunci renderizzata
                await page.waitForSelector('section[data-testid="listing"] a, .SmallCard__link, a[href*=".htm"]', { timeout: 30000 }).catch(() => {});
                await page.waitForTimeout(3000);
                const title = await page.title();
                const links = await page.$$eval('a[href$=".htm"]', els => els.map(e => e.getAttribute('href')));
                const uniq = [...new Set(links)];
                console.log('--- QUERY:', q, '---');
                console.log('Title:', title);
                console.log('Annunci unici:', uniq.length);
                uniq.slice(0, 6).forEach(u => console.log('  ', u));
                const html = await page.content();
                fs.writeFileSync('render_' + q.replace(/\W+/g, '_') + '.html', html);
              } catch (e) {
                console.log('ERRORE query ' + q + ': ' + e.message);
              }
            }
            await browser.close();
          })();
          EOF
          node test.js

      - name: Verifica HTML renderizzato
        run: |
          for f in render_*.html; do
            echo "== $f =="
            grep -c '__NEXT_DATA__' "$f" || true
            # conta annunci con id nell'URL
            grep -oE 'subito\.it/[a-z-]+/[a-zA-Z0-9-]+-([0-9]+)\.htm' "$f" | sort -u | wc -l
            grep -oE '"total"\s*:\s*[0-9]+' "$f" | head -3
          done
