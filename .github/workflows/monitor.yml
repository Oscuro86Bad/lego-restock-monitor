name: LEGO Restock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # fallback (GitHub lo rallenta, il loop self-dispatch fa il ritmo reale)
  workflow_dispatch:
    inputs:
      test_message:
        description: "Invia un messaggio di TEST a Telegram"
        type: boolean
        default: false

concurrency:
  group: lego-restock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Recupera lo stato del ciclo precedente (baseline / "già avvisato")
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          # chiave unica per run; il prefisso serve a ripristinare l'ultima versione salvata
          key: lego-restock-76294-${{ github.run_id }}
          restore-keys: |
            lego-restock-76294-

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # true solo quando lanciato a mano col flag "test_message"
          TEST_MESSAGE: ${{ github.event.inputs && (github.event.inputs.test_message || 'false') || 'false' }}
        run: pwsh -NoProfile -File ./monitor.ps1

      # GitHub rallenta i cron schedulati: auto-lancio del run successivo (~5 min reali)
      - name: Loop (next check in ~4 min)
        env:
          TRIGGER_TOKEN: ${{ secrets.SELF_TRIGGER_TOKEN }}
        run: |
          sleep 240
          curl -s -X POST \
            -H "Authorization: token $TRIGGER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/dispatches" \
            -d '{"ref":"main"}' > /dev/null
          echo "Prossima verifica programmata."
